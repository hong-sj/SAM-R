name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          # DESCRIPTION declares R >= 4.1.0; oldrel-1 is the oldest version
          # r-lib/actions provides, and nothing previously checked that the
          # package installs on anything but the maintainer's machine.
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

  golden-reference:
    # The one job where the strict golden comparison actually executes. The
    # fixtures pin the stopping point of two iterative solvers, so their last
    # digits differ legitimately elsewhere and test-golden.R skips the exact
    # comparisons there. This job reconstructs the recorded stack and asserts
    # it did so, rather than letting the strict path silently never run.
    runs-on: ubuntu-latest
    name: golden reference stack

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Read the recorded R version
        id: recorded
        run: |
          version=$(awk -F': ' '/^r_version:/ {print $2}' \
            tests/testthat/golden/ENVIRONMENT.dcf)
          echo "r-version=${version}" >> "$GITHUB_OUTPUT"
          echo "Fixtures were generated on R ${version}"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.recorded.outputs.r-version }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check

      - name: Assert the recorded stack was reconstructed
        run: |
          recorded <- as.data.frame(
            read.dcf("tests/testthat/golden/ENVIRONMENT.dcf"),
            stringsAsFactors = FALSE
          )
          current <- data.frame(
            r_version = paste(R.version$major, R.version$minor, sep = "."),
            nnet = as.character(packageVersion("nnet")),
            MASS = as.character(packageVersion("MASS")),
            RANN = as.character(packageVersion("RANN")),
            stringsAsFactors = FALSE
          )

          drift <- Filter(Negate(is.null), lapply(names(recorded), function(k) {
            if (identical(recorded[[k]], current[[k]])) NULL
            else sprintf("%s: recorded %s, got %s", k, recorded[[k]], current[[k]])
          }))

          if (length(drift) > 0) {
            cat("The recorded golden stack could not be reconstructed:\n")
            cat(paste0("  - ", unlist(drift), collapse = "\n"), "\n\n")
            cat("Regenerate the fixtures on the new stack with\n")
            cat("  Rscript tests/testthat/golden/make-golden.R\n")
            quit(status = 1)
          }

          cat("Reconstructed the recorded stack exactly.\n")
        shell: Rscript {0}

      - name: Run the suite with the strict golden tier active
        run: |
          pkgload::load_all(".", quiet = TRUE)
          results <- testthat::test_local(".", reporter = "summary",
                                          stop_on_failure = TRUE)
          skipped <- sum(vapply(results, function(r) {
            sum(vapply(r$results, function(x) inherits(x, "expectation_skip"),
                       logical(1)))
          }, integer(1)))
          if (skipped > 0) {
            cat("Expected no skips on the reference stack, saw", skipped, "\n")
            quit(status = 1)
          }
        shell: Rscript {0}
